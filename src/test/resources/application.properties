spring.application.name=erasm

# ---- In-memory H2 database for tests (no MySQL, no env vars required) ----
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# ---- Dummy security values so the context loads during tests ----
jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256-signing-0123456789
jwt.expiration=86400000

logging.level.com.erasm=WARN
logging.level.org.springframework.security=WARN
logging.level.root=WARN
